baseURL = "https://samandlindsay.com/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Samuel & Lindsay"
enableRobotsTXT = true
enableGitInfo = false

[params]
  coupleNames   = "Samuel & Lindsay"
  weddingDate   = "2026-09-19"
  venue         = "Roaring Camp Railroads"
  venueCity     = "Felton, California"
  rsvpEnabled   = false   # flip to true when invitations go out
  contactEmail  = "wedding@samandlindsay.com"
  mealOptions   = ["Chicken", "Fish", "Vegetarian", "Vegan"]

[languages]

  [languages.en]
    label = "English"
    weight       = 1

    [[languages.en.menus.main]]
      name   = "Our Story"
      url    = "/#story"
      weight = 1
    [[languages.en.menus.main]]
      name   = "The Wedding"
      url    = "/#details"
      weight = 2
    [[languages.en.menus.main]]
      name   = "Venue"
      url    = "/#venue"
      weight = 3
    [[languages.en.menus.main]]
      name   = "Travel"
      url    = "/#travel"
      weight = 4
    [[languages.en.menus.main]]
      name   = "Registry"
      url    = "/#registry"
      weight = 5
    [[languages.en.menus.main]]
      name   = "RSVP"
      url    = "/rsvp/"
      weight = 6

  [languages.fr]
    label = "Français"
    weight       = 2

    [languages.fr.params]
      mealOptions = ["Poulet", "Poisson", "Végétarien", "Végétalien"]

    [[languages.fr.menus.main]]
      name   = "Notre Histoire"
      url    = "/fr/#story"
      weight = 1
    [[languages.fr.menus.main]]
      name   = "Le Mariage"
      url    = "/fr/#details"
      weight = 2
    [[languages.fr.menus.main]]
      name   = "Le Lieu"
      url    = "/fr/#venue"
      weight = 3
    [[languages.fr.menus.main]]
      name   = "Voyage"
      url    = "/fr/#travel"
      weight = 4
    [[languages.fr.menus.main]]
      name   = "Liste de Mariage"
      url    = "/fr/#registry"
      weight = 5
    [[languages.fr.menus.main]]
      name   = "RSVP"
      url    = "/fr/rsvp/"
      weight = 6
