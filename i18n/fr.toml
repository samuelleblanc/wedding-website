# ── Lieu ──────────────────────────────────────────────────────
[venue_label]
other = "Là où nous nour marierons"
[venue_p1]
other = "Niché au cœur des montagnes de Santa Cruz, Roaring Camp est l'un des endroits les plus féeriques du nord de la Californie. D'anciens séquoias côtiers — certains âgés de plus de 1 800 ans — seront les témoins silencieux du jour où nous dirons « oui »."
[venue_p2]
other = "Le site longe le ruisseau Bear Creek, entouré de forêts de séquoias anciens, du parfum des pins et du doux bruit d'un chemin de fer à voie étroite serpentant à travers la forêt."
[venue_fact1_title]
