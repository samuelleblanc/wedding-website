<section class="hero" id="hero">
  <div class="hero-bg" aria-hidden="true"></div>

  <div class="hero-content">
    <p class="hero-eyebrow">You are cordially invited to celebrate</p>

    <h1 class="hero-names">Samuel &amp; Lindsay</h1>

    <div class="hero-details">
      <span>September 19, 2026</span>
      <span class="hero-details-sep">·</span>
      <span>Roaring Camp</span>
      <span class="hero-details-sep">·</span>
      <span>Felton, California</span>
    </div>

    <div class="hero-countdown" id="countdown" aria-label="Countdown to wedding">
      <div class="countdown-item">
        <span class="countdown-num" id="cd-days">—</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-hours">—</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-minutes">—</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-seconds">—</span>
        <span class="countdown-label">Seconds</span>
      </div>
    </div>

    <div class="hero-ctas">
      {{ if site.Params.rsvpEnabled }}
      <a href="/rsvp/" class="btn btn-primary">RSVP Now</a>
      {{ end }}
      <a href="#story" class="btn btn-outline">Our Story</a>
    </div>
  </div>

  <!-- Redwood tree silhouettes -->
  <div class="hero-trees" aria-hidden="true">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Back layer - shorter trees -->
      <g opacity="0.35" fill="#0D1F0F">
        <polygon points="80,260 80,180 56,220 56,160 32,200 32,260"/>
        <polygon points="200,260 200,150 170,195 170,130 140,175 140,260"/>
        <polygon points="380,260 380,170 355,210 355,145 328,188 328,260"/>

        <polygon points="1380,260 1380,185 1358,220 1358,162 1336,198 1336,260"/>
      </g>
      <!-- Front layer - taller, darker trees -->
      <g fill="#0A1A0C">
        <!-- Tree 1 -->
        <path d="M50,260 L50,80 L20,130 L20,100 L-10,140 L-10,260 Z"/>
        <path d="M50,260 L50,80 L80,130 L80,100 L110,140 L110,260 Z" opacity="0.7"/>

</section>
