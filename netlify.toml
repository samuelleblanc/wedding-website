[build]
  command   = "hugo --minify"
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  HUGO_VERSION = "0.163.3"

[dev]
  command   = "hugo server"
  port      = 1313
  targetPort = 1313

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[context.production.environment]
  HUGO_ENV = "production"
