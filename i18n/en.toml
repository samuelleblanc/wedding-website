# ── Travel ────────────────────────────────────────────────────
[travel_label]
other = "Getting here & staying nearby"
[travel_title]
other = "Travel & Stay (Santa Cruz)"
[travel_air_title]
other = "✈️ By Air"
[travel_air_desc]
other = "The closest airports are <strong>San Jose (SJC)</strong> — 45 min away — and <strong>San Francisco (SFO)</strong>, about 75 min. Both offer rental cars and rideshare access."
[travel_car_title]
other = "🚗 By Car"
[travel_car_desc]
other = "From San Jose: Take Hwy 17 south to the Felton/Mt. Hermon exit, then follow signs to Roaring Camp. Parking at the venue is free."
[travel_hotel_title]
other = "🏨 Where to Stay"
[travel_hotel_desc]
other = "We recommend staying in <strong>Santa Cruz</strong> (15 min) or <strong>Scotts Valley</strong> (10 min). The hotel near our house is the Hampton Inn. Henry Cowells camping is nearby the Roaring Camp. More location recommendations to come."
[travel_hotel_link]
other = "More details coming soon"
[travel_rideshare_title]
other = "🚕 Getting Around"
[travel_rideshare_desc]
other = "We encourage rideshare (Uber/Lyft) so everyone can celebrate freely. The venue is located at the end of Graham Hill Rd — allow extra time for GPS quirks in the mountains."

