# ── Voyage et hébergement ─────────────────────────────────────
[travel_label]
other = "Comment y arriver et où séjourner"
[travel_title]
other = "Voyage et hébergement (Santa Cruz)"
[travel_air_title]
other = "✈️ En avion"
[travel_air_desc]
other = "Les aéroports les plus proches sont <strong>San Jose (SJC)</strong> — à 45 min — et <strong>San Francisco (SFO)</strong>, à environ 75 min. Les deux offrent des voitures de location et des services de covoiturage."
[travel_car_title]
other = "🚗 En voiture"
[travel_car_desc]
other = "Depuis San Jose : Prenez l'autoroute 17 sud jusqu'à la sortie Felton/Mt. Hermon, puis suivez les panneaux vers Roaring Camp. Le stationnement sur le site est gratuit."
[travel_hotel_title]
other = "🏨 Où séjourner"
[travel_hotel_desc]
other = "Nous recommandons de séjourner à <strong>Santa Cruz</strong> (15 min) ou à <strong>Scotts Valley</strong> (10 min). Le Hampton Inn est tout près de notre maison, tandis que le camping à Henry Cowells est jusque à côté du Roaring Camp."
[travel_hotel_link]
other = "Plus d'informations à venir →"
[travel_rideshare_title]
other = "🚕 Se déplacer"
[travel_rideshare_desc]
other = "Nous encourageons les services de covoiturage (Uber/Lyft) pour que tout le monde puisse célébrer librement. Le lieu est situé au bout du chemin Graham Hill — prévoir du temps supplémentaire pour les caprices du GPS dans les montagnes."

